name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install SkiaSharp native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1 libfreetype6 libharfbuzz0b libpng16-16 libjpeg-turbo8 libwebp7 libgl1

      - name: Restore
        run: dotnet restore converter/Brickwork.sln

      - name: Format check
        run: dotnet format converter/Brickwork.sln --verify-no-changes

      - name: Build
        run: dotnet build converter/Brickwork.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test converter/Brickwork.sln --configuration Release --no-build --verbosity normal
