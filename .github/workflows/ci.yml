name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore converter/InkarnateTools.sln

      - name: Build
        run: dotnet build converter/InkarnateTools.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test converter/InkarnateTools.sln --configuration Release --no-build --verbosity normal
